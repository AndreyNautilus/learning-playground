[defaults]
inventory = /ansible/inventory.ini
remote_user = ansible
private_key_file = /root/.ssh/ansible_key
retry_files_enabled = False
interpreter_python = auto_silent

# Containers get fresh SSH host keys every time they're recreated.
# Fine for a throwaway lab; never do this against real infrastructure.
host_key_checking = False

[privilege_escalation]
become = False
become_method = sudo
