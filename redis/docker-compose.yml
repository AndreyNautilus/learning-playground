# Redis lab — works the same on Windows (Docker Desktop) and macOS.
# Usage: see README.md

services:
  redis:
    # Docker Official Image. Pin the major version;
    # check https://hub.docker.com/_/redis for current tags.
    image: redis:8-alpine
    container_name: redis-lab
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly          # AOF persistence: data survives container restarts
      - "yes"
      - --databases           # number of logical DBs (default is 16; shown explicitly for the lab)
      - "16"
    ports:
      # Bound to localhost only, so nothing else on your network can reach it.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data      # named volume: works identically on Windows and macOS
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-shot CLI container. Same image => same redis-cli version as the server.
  # `docker compose run --rm redis-cli`  -> interactive shell
  redis-cli:
    image: redis:8-alpine
    profiles: ["cli"]
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["redis-cli", "-h", "redis"]
    environment:
      # redis-cli reads the password from here (no warning, no password in shell history)
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    stdin_open: true
    tty: true

  # Optional GUI to browse keys (http://localhost:5540).
  # Start with: docker compose --profile gui up -d
  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["gui"]
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  redisinsight-data:
